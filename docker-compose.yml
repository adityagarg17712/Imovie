version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: imovies-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: imovies_db
    volumes:
      - mongo_data:/data/db

  # 2. Node.js & Express API + Socket.io Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: imovies-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/imovies_db
      JWT_SECRET: imovies_production_super_secret_jwt_key_2026!
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost:5173
      SEAT_LOCK_DURATION_MINUTES: 5
    depends_on:
      - mongo

  # 3. React Vite Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: imovies-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
